name: Build

on:
  push:
    # master, plus the automated manifest branches — a push runs the workflow
    # (Actions-created PRs do not trigger workflows), so the manifest PR still
    # gets the required "build" check and can pass branch protection.
    branches: [ master, 'manifest/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore
