name: Release

# Trigger by pushing a tag like v1.0.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release, versioned from tag)
        run: >
          dotnet build --configuration Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package plugin ZIP
        run: |
          mkdir -p dist/histra.net
          cp Jellyfin.Plugin.HistraNet/bin/Release/net9.0/Jellyfin.Plugin.HistraNet.dll dist/histra.net/
          sed 's/"1.0.0.0"/"${{ steps.ver.outputs.version }}"/' meta.template.json > dist/histra.net/meta.json
          cd dist
          zip -j "histra.net_${{ steps.ver.outputs.version }}.zip" histra.net/Jellyfin.Plugin.HistraNet.dll histra.net/meta.json

      - name: Create GitHub Release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/histra.net_${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true

      - name: Update manifest.json (checksum + url)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="dist/histra.net_${VERSION}.zip"
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/histra.net_${VERSION}.zip"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # sync manifest with the latest master before editing
          git fetch origin master
          git checkout origin/master -- manifest.json
          python3 - "$VERSION" "$MD5" "$URL" "$TS" <<'PY'
          import json, sys
          version, md5, url, ts = sys.argv[1:5]
          with open("manifest.json") as f:
              data = json.load(f)
          entry = {
              "version": version,
              "changelog": f"Release {version} — see GitHub release notes.",
              "targetAbi": "10.11.0.0",
              "sourceUrl": url,
              "checksum": md5,
              "timestamp": ts,
          }
          versions = data[0].setdefault("versions", [])
          versions = [v for v in versions if v.get("version") != version]
          versions.insert(0, entry)
          data[0]["versions"] = versions
          with open("manifest.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      # Open a PR with the manifest update — works with branch protection
      # (a direct push to the protected master branch is rejected).
      - name: Open manifest update PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update manifest for ${{ github.ref_name }}"
          title: "Update manifest for ${{ github.ref_name }}"
          body: "Automated manifest update (checksum + download URL) for release ${{ github.ref_name }}."
          branch: "manifest/${{ github.ref_name }}"
          base: master
          add-paths: manifest.json
          delete-branch: true
